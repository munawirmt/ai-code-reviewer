<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer</title>
    <!-- Tailwind CSS ഫോർ മോഡേൺ ഡിസൈൻ -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-400 mb-2">💻 AI-Powered Code Reviewer</h1>
            <p class="text-gray-400">നിങ്ങളുടെ കോഡ് ഇവിടെ നൽകി ബഗുകളും തിരുത്തലുകളും കണ്ടെത്തൂ!</p>
        </header>

        <!-- API Key Input -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 mb-6">
            <label class="block text-sm font-medium text-gray-300 mb-2">Groq API Key:</label>
            <input type="password" id="apiKey" placeholder="gsk_..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Code Input Section -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 mb-6">
            <label class="block text-sm font-medium text-gray-300 mb-2">Paste your code here:</label>
            <textarea id="userCode" rows="8" placeholder="def add(a, b): return a + b" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 font-mono text-sm focus:outline-none focus:border-indigo-500"></textarea>
            
            <button onclick="reviewCode()" id="reviewBtn" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-lg transition duration-200 cursor-pointer w-full md:w-auto">
                Review Code 🚀
            </button>
        </div>

        <!-- Result Section -->
        <div id="resultContainer" class="bg-gray-900 p-6 rounded-xl border border-gray-800 hidden">
            <h3 class="text-xl font-semibold text-indigo-400 mb-4">📋 Review Report:</h3>
            <div id="loading" class="text-gray-400 hidden mb-2">Analyzing your code... Please wait... ⏳</div>
            <div id="outputContent" class="whitespace-pre-wrap text-gray-300 font-mono text-sm"></div>
        </div>
    </div>

    <!-- JavaScript ഫയൽ ബന്ധിപ്പിക്കുന്നു -->
    <script src="script.js"></script>
</body>
</html>
